name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  php:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: "8.2"
      - run: composer validate --strict
      - run: find src examples Scripts -name '*.php' -print0 | xargs -0 -n1 php -l
      - run: php tests/client_test.php
      - run: php tests/http_client_test.php
