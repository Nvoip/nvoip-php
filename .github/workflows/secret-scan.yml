# NN-5710 — varredura de segredos em PR (modelo padrão da organização Nvoip; manter igual em todos os repositórios).
# - Roda só em pull_request: 1 job curto (~20 s; 1 minuto faturado em repositório privado, gratuito em público).
# - Varre apenas os commits introduzidos pelo PR: não falha por legado do repositório (o legado é triagem à parte).
# - Em caso de achado, o log mostra regra, arquivo, linha e commit (--verbose) com o valor mascarado (--redact).
# - Sem action de terceiros: binário oficial do Gitleaks com versão e SHA-256 fixos (os mesmos já em uso em
#   nvoip-softphone-push/.github/workflows/security.yml); actions/checkout fixado por SHA.
# - O job se chama "gitleaks" para poder virar check obrigatório com o mesmo nome em todos os repositórios.
name: Secret scan

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: secret-scan-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install Gitleaks with pinned release checksum
        shell: bash
        run: |
          set -euo pipefail
          scanner_dir=$(mktemp -d "$RUNNER_TEMP/gitleaks.XXXXXX")
          curl --fail --location --silent --show-error --retry 3 \
            -o "$scanner_dir/gitleaks.tar.gz" \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          printf '%s  %s\n' \
            551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb \
            "$scanner_dir/gitleaks.tar.gz" | sha256sum --check --status
          tar -xzf "$scanner_dir/gitleaks.tar.gz" -C "$scanner_dir" gitleaks
          echo "$scanner_dir" >> "$GITHUB_PATH"
      - name: Scan commits introduced by the pull request
        shell: bash
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          git rev-parse --verify "$BASE^{commit}" >/dev/null
          git rev-parse --verify "$HEAD^{commit}" >/dev/null
          gitleaks git --no-banner --redact --verbose --exit-code 42 --log-opts="$BASE..$HEAD" .
