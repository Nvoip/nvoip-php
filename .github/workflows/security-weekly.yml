# NN-5711 — varredura semanal completa do repositório (Semgrep e dependências), sem bloquear ninguém.
# Modelo padrão da organização Nvoip: manter igual em todos os repositórios (só o horário do cron muda).
# - Complementa o security-pr.yml: o PR só olha o que muda; aqui entra a árvore inteira da branch padrão, que é
#   onde aparecem o legado e os advisories publicados depois do merge.
# - Semgrep usa o pacote p/default atual do registro (as regras se atualizam a cada execução, como pede a
#   VUL-01, regra 4); o OSV-Scanner consulta a base de advisories do dia.
# - Achado não reprova o job: o resultado vai para o resumo da execução e para o artefato
#   `security-weekly-report` (regra, arquivo, linha, pacote, versão e advisory; nunca trecho de código).
#   O job só falha se um scanner não conseguir terminar.
# - 1 job por semana: o custo é o tempo da varredura completa, uma vez por semana, mais as execuções manuais.
name: Security weekly

on:
  schedule:
    - cron: "30 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-weekly
  cancel-in-progress: true

env:
  SEMGREP_IMAGE: semgrep/semgrep@sha256:529ee8a277ec8adc5b534d7c74eea0a47e9de21d62852b6ba7ac6ba9566845c3 # 1.180.0
  OSV_IMAGE: ghcr.io/google/osv-scanner@sha256:afd838850ac1a0fcc15ff4a041dc9ba11123c3f0d2666217a5f0fcf9222b55fa # v2.6.0

jobs:
  security-weekly:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Semgrep on the whole tree (current p/default rules)
        id: semgrep
        shell: bash
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/report"; mkdir -p "$out"
          status=0
          docker run --rm --user "$(id -u):$(id -g)" -e HOME=/tmp -e SEMGREP_SEND_METRICS=off \
            -v "$GITHUB_WORKSPACE:/src:ro" -v "$out:/out" --workdir /src "$SEMGREP_IMAGE" \
            semgrep scan --config p/default --metrics off --disable-version-check --quiet \
              --timeout 60 --max-target-bytes 2000000 --json-output /out/semgrep.json > /dev/null || status=$?
          # Sem --error, achado não altera o código de saída: diferente de 0 é erro do scanner.
          if [ "$status" -ne 0 ] || [ ! -s "$out/semgrep.json" ]; then
            echo "::error::Semgrep did not complete (exit $status)."; exit 2
          fi

      - name: OSV on every manifest and lockfile
        id: osv
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/report"; mkdir -p "$out"
          cfg=()
          if [ -f osv-scanner.toml ]; then cfg=(--config /src/osv-scanner.toml); fi
          status=0
          docker run --rm --user "$(id -u):$(id -g)" -e HOME=/tmp -v "$GITHUB_WORKSPACE:/src:ro" -v "$out:/out" "$OSV_IMAGE" \
            scan source --recursive "${cfg[@]}" --format json --output /out/osv.json /src > "$out/osv.log" 2>&1 || status=$?
          # 0 = sem advisory; 1 = com advisory; 128 = nenhum pacote encontrado. O resto é erro do scanner.
          case "$status" in
            0|1) ;;
            128) echo '{"results":[]}' > "$out/osv.json" ;;
            *) tail -n 30 "$out/osv.log"; echo "::error::OSV-Scanner did not complete (exit $status)."; exit 2 ;;
          esac

      - name: Build the report (metadata only)
        if: ${{ !cancelled() }}
        shell: bash
        env:
          SEMGREP_OUTCOME: ${{ steps.semgrep.outcome }}
          OSV_OUTCOME: ${{ steps.osv.outcome }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import collections, datetime, json, os
          out = os.path.join(os.environ["RUNNER_TEMP"], "report")
          def read(name):
              try:
                  return json.load(open(os.path.join(out, name)))
              except (OSError, ValueError):
                  return {}
          semgrep, osv = read("semgrep.json"), read("osv.json")
          findings = [
              {"rule": r["check_id"], "path": r["path"], "line": r["start"]["line"], "severity": r["extra"].get("severity"),
               "confidence": (r["extra"].get("metadata") or {}).get("confidence"), "cwe": (r["extra"].get("metadata") or {}).get("cwe")}
              for r in semgrep.get("results") or []
          ]
          advisories = []
          for result in osv.get("results") or []:
              source = (result.get("source") or {}).get("path", "").removeprefix("/src/")
              for entry in result.get("packages") or []:
                  pkg = entry.get("package") or {}
                  for group in entry.get("groups") or []:
                      ids = group.get("ids") or []
                      advisories.append({"source": source, "ecosystem": pkg.get("ecosystem"), "package": pkg.get("name"),
                                         "version": pkg.get("version"), "advisory": ids[0] if ids else None,
                                         "aliases": group.get("aliases") or [], "cvss": group.get("max_severity") or None})
          def band(score):
              try:
                  value = float(score)
              except (TypeError, ValueError):
                  return "sem nota"
              return "crítica" if value >= 9 else "alta" if value >= 7 else "média" if value >= 4 else "baixa"
          report = {
              "repository": os.environ.get("GITHUB_REPOSITORY"), "commit": os.environ.get("GITHUB_SHA"), "ref": os.environ.get("GITHUB_REF"),
              "event": os.environ.get("GITHUB_EVENT_NAME"), "run": os.environ.get("GITHUB_RUN_ID"),
              "generatedAtUTC": datetime.datetime.now(datetime.timezone.utc).isoformat(timespec="seconds"),
              "semgrep": {"outcome": os.environ["SEMGREP_OUTCOME"], "version": semgrep.get("version"), "rules": "p/default (registro, versão do dia)",
                          "filesScanned": len((semgrep.get("paths") or {}).get("scanned") or []), "scannerWarnings": len(semgrep.get("errors") or []),
                          "bySeverity": collections.Counter(f["severity"] for f in findings), "findings": findings},
              "dependencies": {"outcome": os.environ["OSV_OUTCOME"], "tool": "osv-scanner v2.6.0",
                               "bySeverity": collections.Counter(band(a["cvss"]) for a in advisories), "advisories": advisories},
          }
          json.dump(report, open(os.path.join(out, "security-weekly-report.json"), "w"), indent=1, ensure_ascii=False)
          lines = [f"## Varredura semanal de segurança — {report['repository']}", "",
                   f"Commit `{report['commit']}` · {report['generatedAtUTC']} · evento `{report['event']}`", "",
                   f"**Semgrep** ({report['semgrep']['outcome']}): {len(findings)} achado(s) em {report['semgrep']['filesScanned']} arquivo(s); "
                   + ", ".join(f"{k}: {v}" for k, v in sorted(report['semgrep']['bySeverity'].items(), key=lambda i: str(i[0]))) , "",
                   f"**Dependências** ({report['dependencies']['outcome']}): {len(advisories)} advisory(ies); "
                   + ", ".join(f"{k}: {v}" for k, v in sorted(report['dependencies']['bySeverity'].items())), ""]
          top = collections.Counter(f["rule"] for f in findings).most_common(10)
          if top:
              lines += ["| Regra do Semgrep | Achados |", "|---|---|"] + [f"| `{rule}` | {count} |" for rule, count in top] + [""]
          worst = sorted((a for a in advisories if band(a["cvss"]) in ("crítica", "alta")), key=lambda a: -float(a["cvss"]))[:15]
          if worst:
              lines += ["| Pacote | Versão | Advisory | CVSS | Arquivo |", "|---|---|---|---|---|"]
              lines += [f"| {a['ecosystem']}/{a['package']} | {a['version']} | {a['advisory']} | {a['cvss']} | `{a['source']}` |" for a in worst] + [""]
          lines += ["Lista completa no artefato `security-weekly-report`. Tratamento e prazos: VUL-01 (seções 4.2 e 4.3)."]
          open(os.path.join(out, "security-weekly-summary.md"), "w").write("\n".join(lines) + "\n")
          open(os.environ["GITHUB_STEP_SUMMARY"], "a").write("\n".join(lines) + "\n")
          print("\n".join(lines[:8]))
          PY
          rm -f "$RUNNER_TEMP/report/semgrep.json" "$RUNNER_TEMP/report/osv.json" "$RUNNER_TEMP/report/osv.log"

      - name: Upload the report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: security-weekly-report
          path: ${{ runner.temp }}/report/security-weekly-*
          if-no-files-found: error
          retention-days: 90
